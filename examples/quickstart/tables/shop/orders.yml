name: orders
schema: shop
comment: "Orders placed in the shop"
columns:
  - name: id
    type: BIGINT
    nullable: false
    comment: "Primary key"
  - name: customer_id
    type: BIGINT
    nullable: false
  - name: status
    type: STRING
    comment: "new, paid or shipped"
  - name: amount
    type: DECIMAL(18,2)
  - name: created_at
    type: TIMESTAMP
clustering:
  columns: [created_at]
